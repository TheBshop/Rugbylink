{% load lang_tags %}

<!-- Language Switcher -->
<div class="dropdown">
    <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-globe me-1"></i>
        {% if LANGUAGE_CODE == 'en' %}🇺🇸 English
        {% elif LANGUAGE_CODE == 'es' %}🇪🇸 Español
        {% elif LANGUAGE_CODE == 'fr' %}🇫🇷 Français
        {% elif LANGUAGE_CODE == 'it' %}🇮🇹 Italiano
        {% elif LANGUAGE_CODE == 'pt' %}🇵🇹 Português
        {% else %}🌐 Language{% endif %}
    </button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
        <li>
            <form method="post" action="{% url 'core:set_language' %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="language" value="en">
                <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'en' %}active{% endif %}">
                    🇺🇸 English
                </button>
            </form>
        </li>
        <li>
            <form method="post" action="{% url 'core:set_language' %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="language" value="es">
                <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'es' %}active{% endif %}">
                    🇪🇸 Español
                </button>
            </form>
        </li>
        <li>
            <form method="post" action="{% url 'core:set_language' %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="language" value="fr">
                <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'fr' %}active{% endif %}">
                    🇫🇷 Français
                </button>
            </form>
        </li>
        <li>
            <form method="post" action="{% url 'core:set_language' %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="language" value="it">
                <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'it' %}active{% endif %}">
                    🇮🇹 Italiano
                </button>
            </form>
        </li>
        <li>
            <form method="post" action="{% url 'core:set_language' %}" class="d-inline">
                {% csrf_token %}
                <input type="hidden" name="language" value="pt">
                <button type="submit" class="dropdown-item {% if LANGUAGE_CODE == 'pt' %}active{% endif %}">
                    🇵🇹 Português
                </button>
            </form>
        </li>
    </ul>
</div>
