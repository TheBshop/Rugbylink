{% extends 'core/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - RugbyLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="bi bi-rugby display-4 text-success"></i>
                    <h2 class="mt-3 mb-1">Welcome Back</h2>
                    <p class="text-muted">Sign in to your RugbyLink account</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-2">Don't have an account?</p>
                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <a href="{% url 'accounts:player_signup' %}" class="btn btn-outline-primary btn-sm">Join as Player</a>
                        <a href="{% url 'accounts:team_signup' %}" class="btn btn-outline-success btn-sm">Join as Team</a>
                        <a href="{% url 'accounts:agent_signup' %}" class="btn btn-outline-warning btn-sm">Join as Agent</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
